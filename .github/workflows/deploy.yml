name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - wiki-updated
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Obsidian Wiki
        uses: actions/checkout@v6
        with:
          repository: FongTszHo/My_Wiki
          path: .wiki-source
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Sync Wiki content
        run: pnpm sync:wiki
        env:
          WIKI_SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - run: pnpm exec nuxt build --preset github_pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
